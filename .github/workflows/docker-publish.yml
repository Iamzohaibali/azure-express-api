
name: Build, Publish and Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  build-publish-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker images
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            zohaibpro/azure-express-api:${{ github.sha }}
            zohaibpro/azure-express-api:professional

      - name: Login to Azure using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy image to Azure App Service
        uses: azure/CLI@v2
        with:
          inlineScript: |
            az webapp config container set \
              --name "privatebackend" \
              --resource-group "dsfjsdj" \
              --docker-custom-image-name "zohaibpro/azure-express-api:${{ github.sha }}"

            az webapp restart \
              --name "privatebackend" \
              --resource-group "dsfjsdj"
